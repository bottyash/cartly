server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # JS files — never cache so updates are picked up immediately
    location ~* \.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache other static assets (CSS, fonts, images)
    location ~* \.(css|woff2?|png|jpg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Reverse proxy → FastAPI backend ───────────────────────────
    # /api/* is forwarded to http://api:8000/ (Docker internal DNS)
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Direct API utility paths
    location ~ ^/(health|docs|openapi\.json|redoc)$ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # Customer portal
    location = /user {
        try_files /user.html =404;
    }
    location = /user.html {
        try_files $uri =404;
    }

    # Admin dashboard
    location = /admin {
        try_files /admin.html =404;
    }
    location = /admin.html {
        try_files $uri =404;
    }

    # All other static files (js, css, html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
